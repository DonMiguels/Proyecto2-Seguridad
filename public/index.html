<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red de Deliveries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">🚚</div>
        <div class="logo-text">Red<span>Envíos</span></div>
    </div>
    <div class="status-badge">
        <div class="status-dot"></div>
        Conectado
    </div>
</header>

<main>
    <h1 class="page-title">Panel de<br><em>Control</em></h1>
    <p class="page-subtitle">Gestión de envíos</p>

    <!-- Tabs nav -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="tab-crear" onclick="switchTab('tab-crear')">
            <span class="tab-icon">📦</span> Crear Envío
        </button>
        <button class="tab-btn" data-tab="tab-buscar" onclick="switchTab('tab-buscar')">
            <span class="tab-icon">🔍</span> Buscar
        </button>
        <button class="tab-btn" data-tab="tab-actualizar" onclick="switchTab('tab-actualizar')">
            <span class="tab-icon">🔄</span> Actualizar Estado
        </button>
    </div>

    <!-- Tab: Crear Envío -->
    <div id="tab-crear" class="tab-panel active">
        <div class="card">
            <div class="card-header">
                <div class="card-num">01</div>
                <div class="card-title">Crear Nuevo Envío</div>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="remitente">Remitente</label>
                        <input type="text" id="remitente" placeholder="Nombre del remitente">
                    </div>
                    <div class="form-group">
                        <label for="destinatario">Destinatario</label>
                        <input type="text" id="destinatario" placeholder="Nombre del destinatario">
                    </div>
                    <div class="form-group full">
                        <label for="direccion_destino">Dirección de Destino</label>
                        <input type="text" id="direccion_destino" placeholder="Calle, número, ciudad">
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" step="0.01" placeholder="0.00">
                    </div>
                </div>
                <button class="btn" id="btnCrear" onclick="crearEnvio()">
                    <div class="spinner"></div>
                    <span class="btn-text">Crear Envío</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <div id="crearResponse" class="response"></div>
            </div>
        </div>
    </div>

    <!-- Tab: Buscar Envío -->
    <div id="tab-buscar" class="tab-panel">
        <div class="card">
            <div class="card-header">
                <div class="card-num">02</div>
                <div class="card-title">Buscar Envío por Tracking</div>
            </div>
            <div class="card-body">
                <div class="form-grid single" style="margin-bottom: 20px">
                    <div class="form-group">
                        <label for="codigo_tracking">Código de Tracking</label>
                        <input type="text" id="codigo_tracking" placeholder="TRK-ABC12345">
                    </div>
                </div>
                <button class="btn" id="btnBuscar" onclick="buscarEnvio()">
                    <div class="spinner"></div>
                    <span class="btn-text">Buscar Envío</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </button>
                <div id="buscarResponse" class="response"></div>
            </div>
        </div>
    </div>

    <!-- Tab: Actualizar Estado -->
    <div id="tab-actualizar" class="tab-panel">
        <div class="card">
            <div class="card-header">
                <div class="card-num">03</div>
                <div class="card-title">Actualizar Estado de Envío</div>
            </div>
            <div class="card-body">
                <div class="form-grid single" style="margin-bottom: 20px">
                    <div class="form-group">
                        <label for="codigo_tracking_update">Código de Tracking</label>
                        <input type="text" id="codigo_tracking_update" placeholder="TRK-ABC12345">
                    </div>
                </div>
                <div style="margin-bottom: 20px">
                    <div class="status-label">Nuevo Estado</div>
                    <div class="status-options">
                        <div class="status-pill" onclick="selectEstado(this, 'REGISTRADO')">Registrado</div>
                        <div class="status-pill" onclick="selectEstado(this, 'EN_TRANSITO')">En Tránsito</div>
                        <div class="status-pill" onclick="selectEstado(this, 'EN_REPARTO')">En Reparto</div>
                        <div class="status-pill" onclick="selectEstado(this, 'ENTREGADO')">Entregado</div>
                        <div class="status-pill" onclick="selectEstado(this, 'CANCELADO')">Cancelado</div>
                    </div>
                </div>
                <button class="btn" id="btnActualizar" onclick="actualizarEstado()">
                    <div class="spinner"></div>
                    <span class="btn-text">Actualizar Estado</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                </button>
                <div id="actualizarResponse" class="response"></div>
            </div>
        </div>
    </div>
</main>

<script src="index.js"></script>
</body>
</html>
