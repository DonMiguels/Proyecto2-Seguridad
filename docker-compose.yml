volumes:
  postgres_data:
  redis_data:
  ldap_data:
  ldap_config:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  ldap_bind_password:
    file: ./secrets/ldap_bind_password.txt
  ldap_admin_password:
    file: ./secrets/ldap_admin_password.txt
  ldap_config_password:
    file: ./secrets/ldap_config_password.txt

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  identity_net:
    driver: bridge
    internal: true
  data_net:
    driver: bridge
    internal: true

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: deliveries_frontend
    init: true
    ports:
      - '8080:8080'
    networks:
      - edge_net
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deliveries_backend
    init: true
    env_file:
      - .env.docker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-deliveries}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LDAP_URL: ${LDAP_URL:-ldaps://ldap:636}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=empresa,dc=local}
      LDAP_USER_ATTRIBUTE: ${LDAP_USER_ATTRIBUTE:-uid}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=svc-backend,ou=ServiceAccounts,dc=empresa,dc=local}
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      LDAP_ROLE_MAPPING: ${LDAP_ROLE_MAPPING}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ISSUER: ${JWT_ISSUER:-deliveries-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-deliveries-clients}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_GMT_OFFSET: ${LOG_GMT_OFFSET:--4}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ldap-ca.crt
    networks:
      - app_net
      - identity_net
      - data_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./ldap/certs/ca.crt:/etc/ssl/certs/ldap-ca.crt:ro
    secrets:
      - jwt_secret
      - db_password
      - ldap_bind_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''net'').createConnection(3000,''127.0.0.1'').on(''connect'',()=>process.exit(0)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: deliveries_db
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-deliveries}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data_net
    secrets:
      - db_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-deliveries}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deliveries_redis
    init: true
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ldap:
    image: osixia/openldap:1.5.0
    container_name: deliveries_ldap
    init: true
    environment:
      LDAP_ORGANISATION: Empresa Deliveries
      LDAP_DOMAIN: empresa.local
      LDAP_BASE_DN: dc=empresa,dc=local
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/ldap_admin_password
      LDAP_CONFIG_PASSWORD_FILE: /run/secrets/ldap_config_password
      LDAP_TLS: 'true'
      LDAP_TLS_ENFORCE: 'true'
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_REMOVE_CONFIG_AFTER_SETUP: 'false'
      LDAP_TLS_CRT_FILENAME: server.crt
      LDAP_TLS_KEY_FILENAME: server.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/bootstrap/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ./ldap/certs:/container/service/slapd/assets/certs
    networks:
      - identity_net
    secrets:
      - ldap_admin_password
      - ldap_config_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'LDAPTLS_CACERT=/container/service/slapd/assets/certs/ca.crt LDAPTLS_REQCERT=demand ldapsearch -x -H ldaps://127.0.0.1:636 -s base -b "" "(objectClass=*)" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  host-despacho:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: host_despacho
    init: true
    command: ['node', 'simulation-cli/hosts/despacho.cli.js']
    environment:
      SIM_API_BASE_URL: http://backend:3000/api/v1
    stdin_open: true
    tty: true
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  host-mostrador:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: host_mostrador
    init: true
    command: ['node', 'simulation-cli/hosts/mostrador.cli.js']
    environment:
      SIM_API_BASE_URL: http://backend:3000/api/v1
    stdin_open: true
    tty: true
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  host-atencion:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: host_atencion
    init: true
    command: ['node', 'simulation-cli/hosts/atencion.cli.js']
    environment:
      SIM_API_BASE_URL: http://backend:3000/api/v1
    stdin_open: true
    tty: true
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  host-consulta:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: host_consulta
    init: true
    command: ['node', 'simulation-cli/hosts/consulta.cli.js']
    environment:
      SIM_API_BASE_URL: http://backend:3000/api/v1
    stdin_open: true
    tty: true
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  host-admin:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: host_admin
    init: true
    command: ['node', 'simulation-cli/hosts/admin.cli.js']
    environment:
      SIM_API_BASE_URL: http://backend:3000/api/v1
    stdin_open: true
    tty: true
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
